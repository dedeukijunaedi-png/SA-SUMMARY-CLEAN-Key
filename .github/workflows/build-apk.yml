name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cek project
        run: |
          test -f package.json || { echo "package.json tidak ada di root repo. Upload zip dulu agar diekstrak." >&2; exit 1; }
          test -f android/gradlew || { echo "android/gradlew tidak ada di root repo." >&2; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Siapkan keystore tetap
        env:
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f signing/sasummary.keystore.enc ] && [ -n "$KSPASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in signing/sasummary.keystore.enc -out "$RUNNER_TEMP/sasummary.keystore" \
              -pass env:KSPASS
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/sasummary.keystore" >> "$GITHUB_ENV"
            echo "Memakai keystore tetap."
          else
            echo "::warning::Keystore tetap belum ada. APK memakai kunci debug (tidak bisa dipasang di atas versi lama bila kunci berbeda)."
          fi

      - name: Build APK
        working-directory: android
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: SA-Summary-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
