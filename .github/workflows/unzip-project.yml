name: Ekstrak Zip Project

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: write

concurrency:
  group: unzip-project
  cancel-in-progress: false

jobs:
  unzip:
    name: Ekstrak zip ke root repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ekstrak zip dan salin ke root repo
        id: extract
        run: |
          set -euo pipefail

          ZIPS=$(git ls-files '*.zip')
          if [ -z "$ZIPS" ]; then
            echo "Tidak ada file .zip di repo. Tidak ada yang perlu diekstrak."
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pilih zip yang paling baru di-commit
          BEST=""
          BEST_T=0
          while IFS= read -r z; do
            T=$(git log -1 --format=%ct -- "$z")
            if [ "${T:-0}" -ge "$BEST_T" ]; then
              BEST="$z"
              BEST_T="${T:-0}"
            fi
          done <<< "$ZIPS"
          echo "Memakai zip: $BEST"

          rm -rf /tmp/unz && mkdir -p /tmp/unz
          unzip -q "$BEST" -d /tmp/unz

          # SA Summary memakai capacitor.config.ts (bukan .json)
          CFG=$(find /tmp/unz -maxdepth 4 \( -name capacitor.config.ts -o -name capacitor.config.json \) -not -path '*/node_modules/*' | head -n1)
          if [ -z "$CFG" ]; then
            echo "capacitor.config.ts/json tidak ditemukan di dalam zip. Dibatalkan, repo tidak diubah." >&2
            exit 1
          fi
          SRC=$(dirname "$CFG")
          if [ ! -f "$SRC/package.json" ]; then
            echo "package.json tidak ditemukan di dalam zip. Dibatalkan, repo tidak diubah." >&2
            exit 1
          fi
          if [ ! -f "$SRC/android/gradlew" ]; then
            echo "android/gradlew tidak ditemukan di dalam zip (SA Summary butuh folder android). Dibatalkan, repo tidak diubah." >&2
            exit 1
          fi
          echo "Folder project di dalam zip: ${SRC#/tmp/unz/}"

          # Folder .github, signing, dan file zip tidak disentuh.
          rm -rf "$SRC/.git" "$SRC/.github" "$SRC/signing" "$SRC/__MACOSX"
          find "$SRC" -name '.DS_Store' -delete

          # Kosongkan isi lama di root repo (kecuali yang dilindungi), lalu salin isi project baru
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name 'signing' ! -name '*.zip' \
            -exec rm -rf {} +
          cp -a "$SRC"/. ./

          git rm -q -f "$BEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan setelah ekstrak."
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat | tail -n 1
          git commit -q -m "Ekstrak $BEST ke root repo"
          git push
          echo "done=true" >> "$GITHUB_OUTPUT"
