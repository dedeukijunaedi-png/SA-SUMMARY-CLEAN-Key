name: Buat Keystore Tetap (jalankan sekali)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Buat dan simpan keystore terenkripsi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Buat keystore terenkripsi
        env:
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KSPASS" ] || [ "${#KSPASS}" -lt 12 ]; then
            echo "Secret ANDROID_KEYSTORE_PASSWORD belum dibuat atau kurang dari 12 karakter." >&2
            exit 1
          fi
          if [ -f signing/sasummary.keystore.enc ]; then
            echo "Keystore sudah ada. Tidak dibuat ulang supaya tanda tangan aplikasi tidak berubah." >&2
            exit 1
          fi
          mkdir -p signing
          keytool -genkeypair -storetype PKCS12 \
            -keystore /tmp/sasummary.keystore -alias sasummary \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KSPASS" -keypass "$KSPASS" \
            -dname "CN=SA Summary, O=SA Summary, C=ID"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in /tmp/sasummary.keystore -out signing/sasummary.keystore.enc \
            -pass env:KSPASS
          rm -f /tmp/sasummary.keystore

      - name: Simpan keystore terenkripsi ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/sasummary.keystore.enc
          git commit -m "Tambah keystore tanda tangan terenkripsi"
          git push
